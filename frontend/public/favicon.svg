<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2D33" />
      <stop offset="100%" stop-color="#02090B" />
    </linearGradient>
    <linearGradient id="favDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38FDF0" />
      <stop offset="100%" stop-color="#00AA9E" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#00F2DE" stroke-width="3" opacity="0.4" />

  <!-- Outer Ripple Arc -->
  <circle cx="32" cy="35" r="26" fill="none" stroke="#00F2DE" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.5" />
  <circle cx="32" cy="35" r="20" fill="none" stroke="#38FDF0" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Central Water Droplet -->
  <path d="M 32 11 
           C 32 11, 46 29, 46 38 
           C 46 46, 39.5 52, 32 52 
           C 24.5 52, 18 46, 18 38 
           C 18 29, 32 11, 32 11 Z" 
        fill="url(#favDrop)" />

  <!-- Clean R Monogram Inside Droplet -->
  <!-- R Stem -->
  <rect x="27" y="27" width="3" height="17" rx="1.5" fill="#FFFFFF" />
  <!-- R Loop -->
  <path d="M 28 27 L 33 27 C 36 27, 37.5 29, 37.5 31.5 C 37.5 34, 36 36, 33 36 L 28 36" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- R Leg -->
  <path d="M 33 35 L 37 43" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Amber Climate Resilience Spark -->
  <circle cx="48" cy="16" r="3.5" fill="#F59E0B" />
</svg>
